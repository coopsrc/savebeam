[package]
name = "savebeam"
version = "0.1.0"
description = "A local-first desktop media downloader"
authors = ["CoopSrc"]
edition = "2024"
default-run = "savebeam"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "savebeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ed25519-dalek = "2.2"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
tokio = { version = "1", features = ["net", "time", "rt", "sync"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
tauri-plugin-dialog = "2.8.3"
trash = { version = "5.2.9", default-features = false, features = ["chrono", "coinit_multithreaded"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
