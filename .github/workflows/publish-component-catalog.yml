name: Publish signed component catalog

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Savebeam Release tag to attach components.json to
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign-and-upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: component-catalog-release
    permissions:
      contents: write
    steps:
      - name: Check out the protected default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies for release verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Require complete review of the exact component candidate
        run: node scripts/verify-component-review.mjs

      - name: Check required tools and manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v openssl
          command -v jq
          command -v xxd
          test -f release/components.unsigned.json
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Sign the component catalog
        env:
          COMPONENT_MANIFEST_SIGNING_KEY: ${{ secrets.SAVEBEAM_COMPONENT_MANIFEST_SIGNING_KEY }}
        run: |
          umask 077
          key_dir=$(mktemp -d)
          key_file="$key_dir/signing-key.pem"
          trap 'rm -f "$key_file"; rmdir "$key_dir"' EXIT
          test -n "$COMPONENT_MANIFEST_SIGNING_KEY"
          printf '%s\n' "$COMPONENT_MANIFEST_SIGNING_KEY" > "$key_file"
          scripts/sign-component-manifest.sh \
            release/components.unsigned.json \
            "$key_file" \
            "$RUNNER_TEMP/components.json"

      - name: Attach the signed catalog to the existing Release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/components.json" --repo "$GITHUB_REPOSITORY"
