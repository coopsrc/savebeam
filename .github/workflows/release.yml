name: Build desktop release candidates

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      signing_mode:
        description: unsigned creates internal candidates only; signed requires OS release credentials
        type: choice
        options: [unsigned, signed]
        default: unsigned

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    environment: desktop-release
    env:
      SIGNING_MODE: ${{ inputs.signing_mode || 'unsigned' }}
      npm_config_registry: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            target: aarch64-apple-darwin
          - runner: windows-2022
            platform: win32
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add '${{ matrix.target }}'
      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install locked dependencies and run checks
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          if [[ '${{ matrix.platform }}' == darwin ]]; then
            python3 scripts/test_generate_notices.py
            python3 scripts/generate-notices.py
          else
            python scripts/test_generate_notices.py
            python scripts/generate-notices.py
          fi
          git diff --exit-code -- docs/releases/THIRD_PARTY_NOTICES.txt
      - name: Import macOS release signing credentials
        if: matrix.platform == 'darwin' && inputs.signing_mode == 'signed'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE" && test -n "$APPLE_API_ISSUER" && test -n "$APPLE_API_KEY" && test -n "$API_KEY_CONTENT"
          [[ "$APPLE_SIGNING_IDENTITY" == 'Developer ID Application:'* ]]
          umask 077
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/release.keychain-db"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/release.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db" login.keychain-db
          printf '%s' "$API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Import Windows signing certificate
        if: matrix.platform == 'win32' && inputs.signing_mode == 'signed'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:CERTIFICATE) { throw 'Missing Windows release certificate' }
          $certificatePath = Join-Path $env:RUNNER_TEMP certificate.pfx
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (!$cert.HasPrivateKey -or $cert.NotAfter -lt (Get-Date)) { throw 'Unusable Windows signing certificate' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Remove-Item $certificatePath
      - name: Build installer and version-bound updater packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.signing_mode == 'signed' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ inputs.signing_mode == 'signed' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ inputs.signing_mode == 'signed' && secrets.APPLE_API_KEY || '' }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          if [[ '${{ matrix.platform }}' == darwin && "$SIGNING_MODE" == signed ]]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          else
            unset APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY
          fi
          node scripts/prepare-release.mjs '${{ matrix.platform }}' "$SIGNING_MODE" "$RUNNER_TEMP/release.json"
          pnpm tauri build --target '${{ matrix.target }}' --config "$RUNNER_TEMP/release.json" -- --locked
          node scripts/verify-release-signatures.mjs 'src-tauri/target/${{ matrix.target }}/release/bundle'
          node scripts/collect-release.mjs 'src-tauri/target/${{ matrix.target }}/release/bundle' release-candidate '${{ matrix.platform }}' "$SIGNING_MODE"
      - name: Verify macOS OS signatures and notarization
        if: matrix.platform == 'darwin' && inputs.signing_mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          app='src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Savebeam.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep 'Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Verify Windows OS signature
        if: matrix.platform == 'win32' && inputs.signing_mode == 'signed'
        shell: pwsh
        run: |
          Get-ChildItem release-candidate -Filter *.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') { throw 'Installer signature verification failed' }
          }
      - name: Mark successfully verified signatures
        if: inputs.signing_mode == 'signed'
        shell: bash
        run: node -e 'const fs=require("node:fs"),p="release-candidate/build-info.json",j=JSON.parse(fs.readFileSync(p));j.osSignatureVerified=true;fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: savebeam-${{ matrix.target }}-${{ env.SIGNING_MODE }}
          path: release-candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Delete temporary macOS credentials
        if: always() && matrix.platform == 'darwin' && inputs.signing_mode == 'signed'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
      - name: Delete temporary Windows credentials
        if: always() && matrix.platform == 'win32' && inputs.signing_mode == 'signed'
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" -ErrorAction SilentlyContinue }
          Remove-Item "$env:RUNNER_TEMP\certificate.pfx" -ErrorAction SilentlyContinue
