name: Bug report / 问题反馈
description: Report a reproducible issue without sharing private data.
body:
  - type: markdown
    attributes:
      value: |
        Do not post cookies, proxy credentials, personal file paths, signed media URLs or private videos.
        请勿上传 Cookie、代理凭据、个人路径、签名媒体链接或私有视频。诊断附件由你自行决定，分享前请检查。
  - type: textarea
    id: environment
    attributes:
      label: Version and platform / 版本与平台
      description: Copy basic information from Settings → About. No personal paths are needed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result / 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
      description: Include the visible error message; redact any sensitive screenshot or attachment.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私
      options:
        - label: I have checked that this report contains no secrets or private data. / 已确认未包含敏感信息。
          required: true
